<div class="min-h-screen bg-gradient-to-br from-slate-950 via-indigo-950 to-slate-950 text-white">
  <div class="mx-auto w-full max-w-[1100px] px-3 py-4 sm:px-4 sm:py-6">
    <div class="flex flex-col gap-4 lg:flex-row lg:gap-6">
      <!-- Left: Control Panel -->
      <app-control-panel
        [balance]="balance"
        [betAmount]="betAmount"
        [numberOfMines]="numberOfMines"
        [gridSize]="gridSize"
        [gameState]="gameState"
        [soundEnabled]="soundEnabled"
        [musicEnabled]="musicEnabled"
        [mineOptions]="mineOptions"
        [gridSizes]="gridSizes"
        (startGame)="startGame()"
        (cashOut)="cashOut()"
        (resetGame)="resetGame()"
        (adjustBet)="adjustBet($event)"
        (setMineCount)="setMineCount($event)"
        (setGridSize)="setGridSize($event)"
        (setSelectionLimit)="setSelectionLimit($event)"
        (toggleSound)="toggleSound()"
        (toggleMusic)="toggleMusic()">
      </app-control-panel>

      <!-- Right: Board -->
      <div class="flex-1">
        <div class="rounded-xl bg-slate-900/30 p-3 ring-1 ring-white/10 sm:p-4">
          <app-game-header
            [currentMultiplier]="gameState.currentMultiplier"
            [betAmount]="betAmount"
            [revealedTiles]="gameState.revealedTiles"
            [multiplierDisplay]="getMultiplierDisplay()">
          </app-game-header>

          <div class="relative">
            <app-game-grid
              [tiles]="tiles"
              [gameState]="gameState"
              [gridSize]="gridSize"
              (tileClick)="revealTile($event)">
            </app-game-grid>

            <div class="pointer-events-none absolute inset-0 flex items-center justify-center">
              <app-game-status [gameState]="gameState"></app-game-status>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
