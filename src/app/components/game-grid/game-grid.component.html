<div class="flex justify-center">
  <div class="w-full">
    <div
      class="mx-auto grid gap-3"
      [style.grid-template-columns]="'repeat(' + gridSize + ', 1fr)'"
      [style.max-width]="'min(92vw, ' + (gridSize * 96) + 'px)'">
      
      <button 
        *ngFor="let tile of tiles; trackBy: trackByTileId"
        (click)="onTileClick(tile)"
        [disabled]="!gameState.isPlaying || tile.revealed || gameState.gameOver"
        class="grid-tile aspect-square rounded-xl transition-all duration-300 text-2xl font-bold relative overflow-hidden"
        [ngClass]="{
          'tile--hidden': !tile.revealed,
          'tile--safe diamond-shine': tile.revealed && !tile.isMine,
          'tile--mine mine-explode': tile.revealed && tile.isMine,
          'cursor-not-allowed opacity-50': !gameState.isPlaying || gameState.gameOver,
          'transform scale-95': tile.revealed
        }">
        
        <!-- Tile content -->
        <div *ngIf="!tile.revealed" class="absolute inset-0 flex items-center justify-center">
          <div class="h-2 w-2 rounded-full bg-white/15"></div>
        </div>
        
        <!-- Diamond (safe tile) -->
        <div *ngIf="tile.revealed && !tile.isMine" class="absolute inset-0 flex items-center justify-center">
          <svg class="h-10 w-10 text-cyan-200 drop-shadow" fill="currentColor" viewBox="0 0 24 24">
            <path d="M12 2L4 7l8 15 8-15-8-5z"/>
          </svg>
        </div>
        
        <!-- Mine -->
        <div *ngIf="tile.revealed && tile.isMine" class="absolute inset-0 flex items-center justify-center">
          <div class="relative">
            <svg class="h-10 w-10 text-slate-900" fill="currentColor" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="8"/>
            </svg>
            <svg class="w-3 h-3 text-yellow-400 absolute top-1 left-1/2 transform -translate-x-1/2" fill="currentColor" viewBox="0 0 24 24">
              <path d="M12 2l1.5 4.5L18 8l-4.5 1.5L12 14l-1.5-4.5L6 8l4.5-1.5L12 2z"/>
            </svg>
          </div>
        </div>
        
      </button>
    </div>
  </div>
</div>
