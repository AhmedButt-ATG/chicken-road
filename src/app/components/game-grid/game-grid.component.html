<div class="flex justify-center p-4">
  <div class="w-full max-w-[600px]">
    <div
      class="mx-auto grid gap-2 sm:gap-3 p-2 rounded-2xl bg-black/20"
      [style.grid-template-columns]="'repeat(' + gridSize + ', 1fr)'"
      [style.max-width]="'min(95vw, ' + (gridSize * 100) + 'px)'">

      <button
        *ngFor="let tile of tiles; trackBy: trackByTileId"
        (click)="onTileClick(tile)"
        [disabled]="!gameState.isPlaying || tile.revealed || gameState.gameOver || (gameState.selectionLimit && (gameState.picksMade ?? 0) >= gameState.selectionLimit)"
        class="grid-tile group aspect-square rounded-lg sm:rounded-xl relative overflow-hidden select-none outline-none transition-all"
        [ngClass]="{
          'tile--hidden': !tile.revealed,
          'tile--safe active:scale-95': tile.revealed && !tile.isMine,
          'tile--mine': tile.revealed && tile.isMine,
          'opacity-40 grayscale-[0.5]': (!gameState.isPlaying || gameState.gameOver) && !tile.revealed
        }">

        <div *ngIf="!tile.revealed" class="absolute inset-0 bg-gradient-to-tr from-white/5 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>

        <div *ngIf="!tile.revealed" class="absolute inset-0 flex items-center justify-center">
          <div class="h-1.5 w-1.5 rounded-full bg-slate-500/40 group-hover:bg-emerald-500/50 group-hover:scale-150 transition-all"></div>
        </div>

        <div *ngIf="tile.revealed && !tile.isMine" class="absolute inset-0 flex items-center justify-center animate-in zoom-in duration-300">
          <div class="relative h-2/3 w-2/3">
            <img src="diamond.png" class="w-full h-full drop-shadow-xl" />
          </div>
        </div>

        <div *ngIf="tile.revealed && tile.isMine" class="absolute inset-0 flex items-center justify-center animate-in zoom-in spin-in-12 duration-500">
          <div class="relative h-2/3 w-2/3">
             <img src="bomb.png" class="w-full h-full drop-shadow-xl" />
             <div class="absolute -top-1 -right-1 h-3 w-3 bg-orange-500 rounded-full animate-pulse shadow-[0_0_10px_#f97316]"></div>
          </div>
        </div>
      </button>
    </div>
  </div>
</div>
