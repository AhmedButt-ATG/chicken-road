<div class="select-none text-center">
  <div
    *ngIf="!gameState.isPlaying && !gameState.gameOver && !gameState.won"
    class="status status--idle">
    PRESS BET TO START
  </div>
  <div *ngIf="gameState.gameOver" class="status status--lose">GAME OVER</div>
  <div *ngIf="gameState.won" class="status status--win">
    YOU WON! €{{gameState.potentialPayout.toFixed(2)}}
  </div>
</div>
