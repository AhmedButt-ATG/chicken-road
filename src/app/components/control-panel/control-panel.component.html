<div class="control-panel w-full lg:w-[360px] rounded-xl bg-slate-950/70 p-3 ring-1 ring-white/10 sm:p-4">
  <div class="rounded-lg bg-black/20 p-3 ring-1 ring-white/10">
  
  <!-- Mine Selection -->
  <div class="mb-4">
    <h3 class="mb-2 text-[11px] font-extrabold tracking-wider text-white/70">NUMBER OF MINES</h3>
    <div class="grid grid-cols-5 overflow-hidden rounded-md bg-white/5 ring-1 ring-white/10">
      <button 
        *ngFor="let option of mineOptions" 
        (click)="onSetMineCount(option)"
        [disabled]="gameState.isPlaying"
        class="py-2 text-sm font-extrabold transition-all"
        [ngClass]="{
          'bg-emerald-500 text-black': numberOfMines === option,
          'text-white/80 hover:bg-white/10': numberOfMines !== option,
          'opacity-50 cursor-not-allowed': gameState.isPlaying,
          'ring-1 ring-inset ring-white/10': true
        }">
        {{option}}
      </button>
      <button 
        class="py-2 text-sm font-extrabold text-white/80 hover:bg-white/10 ring-1 ring-inset ring-white/10"
        [disabled]="gameState.isPlaying">
        CUSTOM
      </button>
    </div>
  </div>

  <!-- Grid Size Selection -->
  <div class="mb-4">
    <h3 class="mb-2 text-[11px] font-extrabold tracking-wider text-white/70">GRID SIZE</h3>
    <div class="grid grid-cols-4 gap-2">
      <button 
        *ngFor="let size of gridSizes" 
        (click)="onSetGridSize(size)"
        [disabled]="gameState.isPlaying"
        class="rounded-full bg-white/5 py-2 text-sm font-extrabold text-white/80 ring-1 ring-inset ring-white/10 transition-all hover:bg-white/10"
        [ngClass]="{
          'bg-emerald-500 text-black ring-emerald-500/40': gridSize === size,
          'opacity-50 cursor-not-allowed': gameState.isPlaying
        }">
        {{size}}x{{size}}
      </button>
    </div>
  </div>

  <!-- Balance and Bet Section -->
  <div class="mb-3 rounded-md bg-black/30 ring-1 ring-white/10">
    <div class="grid grid-cols-2 items-center gap-0">
      <div class="px-3 py-2">
        <div class="text-[11px] font-extrabold tracking-wider text-white/60">DEMO BALANCE</div>
        <div class="text-xl font-black">€{{balance.toFixed(2)}}</div>
      </div>
      <div class="border-l border-white/10 px-3 py-2 text-right">
        <div class="text-[11px] font-extrabold tracking-wider text-white/60">WIN</div>
        <div class="text-lg font-black" [ngClass]="gameState.won ? 'text-emerald-400' : 'text-white/70'">
          {{gameState.won ? ('€' + gameState.potentialPayout.toFixed(2)) : '—'}}
        </div>
      </div>
    </div>
  </div>

  <!-- Bet Controls -->
  <div class="mb-4">
    <div class="mb-2 text-center text-lg font-black">€{{betAmount.toFixed(2)}}</div>

    <div class="mb-3 flex items-center gap-3">
      <button
        (click)="onAdjustBet(-0.50)"
        [disabled]="gameState.isPlaying"
        class="grid h-9 w-9 place-items-center rounded-md bg-white/5 text-white/80 ring-1 ring-inset ring-white/10 transition hover:bg-white/10 disabled:opacity-50">
        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M6 10l6-6v12l-6-6z"/>
        </svg>
      </button>

      <div class="h-2 flex-1 rounded-full bg-white/10 ring-1 ring-inset ring-white/10">
        <div class="h-2 w-1/3 rounded-full bg-emerald-500"></div>
      </div>

      <button
        (click)="onAdjustBet(0.50)"
        [disabled]="gameState.isPlaying"
        class="grid h-9 w-9 place-items-center rounded-md bg-white/5 text-white/80 ring-1 ring-inset ring-white/10 transition hover:bg-white/10 disabled:opacity-50">
        <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 20 20" aria-hidden="true">
          <path d="M14 10l-6 6V4l6 6z"/>
        </svg>
      </button>
    </div>
    
    <!-- Main Action Button -->
    <button 
      *ngIf="!gameState.isPlaying && !gameState.gameOver && !gameState.won"
      (click)="onStartGame()"
      class="w-full rounded-full bg-emerald-500 py-4 text-lg font-black text-black transition-colors hover:bg-emerald-400">
      BET
    </button>
    
    <button 
      *ngIf="gameState.isPlaying && !gameState.gameOver"
      (click)="onCashOut()"
      [disabled]="gameState.revealedTiles === 0"
      class="w-full rounded-full bg-emerald-500 py-3 text-lg font-black text-black transition-colors hover:bg-emerald-400 disabled:cursor-not-allowed disabled:opacity-50">
      <div class="leading-none">COLLECT</div>
      <div class="text-sm font-extrabold">€{{gameState.potentialPayout.toFixed(2)}}</div>
    </button>
    
    <button 
      *ngIf="gameState.gameOver || gameState.won"
      (click)="onResetGame()"
      class="w-full rounded-full bg-emerald-500 py-4 text-lg font-black text-black transition-colors hover:bg-emerald-400">
      {{gameState.gameOver ? 'BET' : 'NEW GAME'}}
    </button>
  </div>

  <!-- Control Icons -->
  <div class="flex justify-around rounded-md bg-black/20 py-3 ring-1 ring-white/10">
    <button 
      (click)="onToggleSound()"
      class="flex flex-col items-center space-y-1 p-2 rounded transition-colors"
      [ngClass]="soundEnabled ? 'text-emerald-400' : 'text-gray-500'">
      <div class="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path d="M10 3.75a.75.75 0 0 0-1.264-.546L5.203 6H2.75A.75.75 0 0 0 2 6.75v6.5c0 .414.336.75.75.75h2.453l3.533 2.796A.75.75 0 0 0 10 16.25V3.75zM15.536 5.464a.75.75 0 0 1 0 1.061 3.5 3.5 0 0 1 0 4.95.75.75 0 1 1-1.061-1.06 2 2 0 0 0 0-2.83.75.75 0 0 1 1.061-1.06z"/>
        </svg>
      </div>
      <span class="text-xs">SOUND</span>
    </button>
    
    <button 
      (click)="onToggleMusic()"
      class="flex flex-col items-center space-y-1 p-2 rounded transition-colors"
      [ngClass]="musicEnabled ? 'text-emerald-400' : 'text-gray-500'">
      <div class="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center">
        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
          <path d="M15.5 2.25a.75.75 0 0 1 .75.75v11.69l-3.061-2.498a1.5 1.5 0 0 0-1.878 0L8.25 14.69V3a.75.75 0 0 1 .75-.75h6.5z"/>
        </svg>
      </div>
      <span class="text-xs">MUSIC</span>
    </button>
    
    <button class="flex flex-col items-center space-y-1 p-2 rounded transition-colors text-emerald-400">
      <div class="w-8 h-8 rounded-full border-2 border-current flex items-center justify-center">
        <span class="text-sm font-bold">i</span>
      </div>
      <span class="text-xs">INFO</span>
    </button>
  </div>

  </div>
</div>
