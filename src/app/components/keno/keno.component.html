<section class="min-h-screen bg-[#0a0c14] px-2 py-4 text-slate-100 sm:px-4 lg:py-8 font-sans">
  <div class="mx-auto max-w-4xl">
    
    <header class="mb-4 flex items-center justify-between rounded-2xl border border-white/5 bg-slate-900/40 p-4 backdrop-blur-md">
      <div>
        <h1 class="text-xl font-black tracking-tighter text-cyan-400 uppercase">Keno Royale</h1>
        <p class="text-[10px] uppercase tracking-widest text-slate-500">Premium iGaming</p>
      </div>
      <div class="flex gap-4">
        <div class="text-right">
          <p class="text-[10px] uppercase text-slate-500">Payout</p>
          <p class="text-lg font-mono font-bold text-emerald-400">{{ currentPayout | number:'1.0-0' }}x</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] uppercase text-slate-500">Spots</p>
          <p class="text-lg font-mono font-bold text-white">{{ selectedNumbers.length }}/10</p>
        </div>
      </div>
    </header>

    <div class="grid gap-4 lg:grid-cols-12">
      
      <div class="lg:col-span-8 space-y-4">
        
        <div class="flex flex-wrap items-center justify-between gap-2 rounded-xl bg-slate-900/60 p-2 border border-white/5">
          <div class="flex items-center gap-2">
            <button (click)="quickPick()" [disabled]="isInteractionLocked" class="btn-util">Quick 10</button>
            <button (click)="clearBoard()" [disabled]="isInteractionLocked" class="btn-util">Clear</button>
          </div>
          
          <div class="flex items-center gap-2">
            <div class="flex items-center bg-black/40 rounded-lg px-2 border border-white/10">
              <span class="text-[10px] font-bold text-slate-500 mr-2">BET</span>
              <input [(ngModel)]="betAmount" type="number" class="w-12 bg-transparent py-1 text-sm font-bold outline-none text-cyan-400">
            </div>
            <button (click)="play()" [disabled]="!canPlay" class="btn-play">PLAY</button>
          </div>
        </div>

        <div class="grid grid-cols-8 gap-1.5 sm:grid-cols-10 bg-slate-900/40 p-3 rounded-2xl border border-white/5">
          <button
            *ngFor="let value of boardNumbers; trackBy: trackByNumber"
            (click)="toggleNumber(value)"
            [disabled]="isInteractionLocked"
            class="tile-base"
            [ngClass]="getTileClasses(value)"
          >
            {{ value }}
          </button>
        </div>

        <div class="rounded-xl bg-cyan-500/5 border border-cyan-500/20 p-3 text-center">
           <p class="text-xs font-medium text-cyan-200">{{ statusMessage }}</p>
        </div>
      </div>

      <div class="lg:col-span-4 space-y-4">
        
        <div class="rounded-2xl border border-white/5 bg-slate-900/40 p-4">
          <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-3">Auto Mode</h3>
          <div class="flex gap-2">
            <button (click)="startAutoPlay(5)" [disabled]="!canPlay" class="btn-auto">x5</button>
            <button (click)="startAutoPlay(10)" [disabled]="!canPlay" class="btn-auto">x10</button>
          </div>
        </div>

        <div class="rounded-2xl border border-white/5 bg-slate-900/40 p-4">
          <h3 class="text-[10px] font-bold uppercase tracking-widest text-slate-500 mb-3">Paytable ({{paytableSpotCount}} Spots)</h3>
          <div class="space-y-1 max-h-[250px] overflow-y-auto pr-2 custom-scroll">
            <div *ngFor="let row of paytableEntries" 
                 class="flex justify-between py-1 px-3 rounded-lg text-xs"
                 [ngClass]="isPaytableHit(row.matches) ? 'bg-emerald-500/20 text-emerald-300 font-bold border border-emerald-500/30' : 'text-slate-400'">
              <span>{{ row.matches }} Hits</span>
              <span>{{ row.multiplier }}x</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</section>
