<section class="perspective-container relative min-h-screen overflow-hidden bg-[#030508] px-2 py-8 text-slate-100 font-sans">
  <div class="pointer-events-none absolute -top-24 -left-24 h-[500px] w-[500px] rounded-full bg-cyan-500/10 blur-[140px]"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 h-[500px] w-[500px] rounded-full bg-blue-600/10 blur-[140px]"></div>

  <div class="relative mx-auto max-w-6xl">
    
    <header class="header-3d mb-8 flex items-center justify-between rounded-[2rem] border-t border-white/20 bg-gradient-to-b from-white/10 to-white/5 p-6 backdrop-blur-xl shadow-[0_20px_40px_rgba(0,0,0,0.6)]">
      <div class="flex items-center gap-4">
        <div class="flex flex-col">
          <h1 class="text-4xl font-[1000] italic tracking-tighter text-white drop-shadow-[0_2px_0_#0ea5e9]">KENO</h1>
          <span class="text-[9px] font-black uppercase tracking-[0.4em] text-cyan-500/60">High Stakes Engine</span>
        </div>
      </div>
      
      <div class="flex gap-10">
        <div class="text-right">
          <p class="text-[10px] font-bold uppercase text-slate-400">Last Payout</p>
          <p class="text-3xl font-mono font-black text-emerald-400 drop-shadow-[0_0_15px_rgba(52,211,153,0.4)]">{{ currentPayout | number:'1.0-0' }}x</p>
        </div>
        <div class="text-right">
          <p class="text-[10px] font-bold uppercase text-slate-400">Spots</p>
          <p class="text-3xl font-mono font-black text-white">{{ selectedNumbers.length }}<span class="text-slate-600">/10</span></p>
        </div>
      </div>
    </header>

    <div class="grid gap-8 lg:grid-cols-12">
      
      <div class="lg:col-span-8 space-y-6">
        
        <div class="control-panel-3d flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-[#0f121a] border-t border-white/10 p-4 shadow-2xl">
          <div class="flex items-center gap-3">
            <button (click)="quickPick()" [disabled]="isInteractionLocked" class="btn-3d-secondary">QUICK PICK</button>
            <button (click)="clearBoard()" [disabled]="isInteractionLocked" class="btn-3d-danger">RESET</button>
          </div>
          
          <div class="flex items-center gap-4">
            <div class="relative bg-black/60 rounded-xl px-4 py-2 border-b-2 border-cyan-500/30">
              <span class="text-[10px] font-black text-slate-500 block uppercase">Bet Amount</span>
              <input [(ngModel)]="betAmount" type="number" class="w-20 bg-transparent text-xl font-black outline-none text-cyan-400">
            </div>
            <button (click)="play()" [disabled]="!canPlay" class="btn-3d-primary">
              PLACE BET
            </button>
          </div>
        </div>

        <div class="board-3d-wrapper">
          <div class="grid grid-cols-8 gap-3 sm:grid-cols-10 bg-[#0a0c14] p-6 rounded-[2.5rem] border border-white/5 shadow-[inset_0_4px_20px_rgba(0,0,0,0.8)]">
            <button
              *ngFor="let value of boardNumbers; trackBy: trackByNumber"
              (click)="toggleNumber(value)"
              [disabled]="isInteractionLocked"
              class="tile-3d"
              [ngClass]="getTileClasses(value)"
            >
              <span class="relative z-10">{{ value }}</span>
            </button>
          </div>
        </div>

      </div>

      <div class="lg:col-span-4 space-y-6">
        <div class="card-3d rounded-3xl border-t border-white/10 bg-[#0f121a] p-6 shadow-2xl">
          <h3 class="text-[11px] font-black uppercase tracking-[0.2em] text-slate-400 mb-6">Strategy Matrix</h3>
          <div class="space-y-3 max-h-[400px] overflow-y-auto pr-2 custom-scroll">
            <div *ngFor="let row of paytableEntries" 
                 class="pay-row-3d flex justify-between items-center py-3 px-5 rounded-xl border border-white/5 bg-black/20"
                 [ngClass]="{'pay-row-3d-active': isPaytableHit(row.matches)}">
              <span class="text-xs font-bold">{{ row.matches }} Hits</span>
              <span class="font-mono font-black text-cyan-400">{{ row.multiplier }}x</span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
