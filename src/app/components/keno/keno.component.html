<section class="perspective-container relative min-h-screen overflow-hidden px-2 py-8 text-slate-100 font-sans bg-cover bg-center bg-no-repeat">
  <div class="absolute inset-0 z-0 bg-cover bg-center bg-no-repeat blur-[5px]" style="background-image: url('/bg.png');"></div>
  <div class="pointer-events-none absolute -top-24 -left-24 h-[600px] w-[600px] rounded-full bg-cyan-400/30 blur-[160px] mix-blend-lighten"></div>
  <div class="pointer-events-none absolute -bottom-24 -right-24 h-[600px] w-[600px] rounded-full bg-purple-400/20 blur-[160px] mix-blend-lighten"></div>

  <div class="relative mx-auto max-w-6xl">
    
    <header class="header-3d mb-6 flex items-center justify-between rounded-2xl border-b-4 border-black/40 bg-gradient-to-r from-slate-900 via-slate-800 to-slate-900 p-6 shadow-[0_20px_50px_rgba(0,0,0,0.8)]">
      <div class="flex flex-col">
        <h1 class="text-5xl font-[1000] italic tracking-tighter text-transparent bg-clip-text bg-gradient-to-b from-white to-cyan-400 drop-shadow-[0_4px_10px_rgba(6,182,212,0.5)]">
          KENO
        </h1>
      </div>
      

      <div class="flex gap-8">
        <div class="text-center bg-black/30 p-2 rounded-xl min-w-[100px] border-t border-white/5">
          <p class="text-[9px] font-black text-slate-500 uppercase">Balance</p>
          <p class="text-2xl font-mono font-black text-emerald-400">${{ balance | number:'1.1-1' }}</p>
        </div>
     
      </div>
    </header>

    <div class="grid gap-6 lg:grid-cols-12">
      
      <div class="lg:col-span-8 space-y-4">
        
        <div class="board-3d-wrapper relative group">
          <div class="absolute inset-0 pointer-events-none rounded-[2rem] z-30 overflow-hidden opacity-10">
            <div class="h-full w-full bg-[linear-gradient(rgba(18,16,16,0)_50%,rgba(0,0,0,0.25)_50%),linear-gradient(90deg,rgba(255,0,0,0.06),rgba(0,255,0,0.02),rgba(0,0,255,0.06))] bg-[length:100%_4px,3px_100%]"></div>
          </div>

          <div class="grid grid-cols-8 gap-2.5 sm:grid-cols-10 bg-[#080a0f] p-6 rounded-[2rem] border-4 border-[#1e2330] shadow-[0_0_60px_rgba(0,0,0,0.5),inset_0_0_40px_rgba(0,0,0,0.9)]">
            <button
              *ngFor="let value of boardNumbers; trackBy: trackByNumber"
              (click)="toggleNumber(value)"
              [disabled]="isInteractionLocked"
              class="tile-3d"
              [ngClass]="getTileClasses(value)"
            >
              <span class="relative z-10">{{ value }}</span>
            </button>
          </div>
        </div>

        <div class="flex flex-wrap items-center justify-between gap-4 rounded-2xl bg-[#0f121a] border-b-4 border-black/40 p-4 shadow-2xl">
          <div class="flex gap-2">
            <button (click)="quickPick()" [disabled]="isInteractionLocked" class="btn-game-secondary">QUICK PICK</button>
            <button (click)="clearBoard()" [disabled]="isInteractionLocked" class="btn-game-danger">CLEAR</button>
          </div>
          
          <div class="flex items-center gap-4">
            <div class="flex flex-col">
              <span class="text-[10px] font-black text-slate-500 uppercase ml-1">BET</span>
              <div class="flex items-center bg-black/60 rounded-xl px-3 border border-white/10">
                <span class="text-cyan-500 font-bold">$</span>
                <input [(ngModel)]="betAmount" type="number" class="w-16 bg-transparent py-2 text-lg font-black outline-none text-white text-center">
              </div>
            </div>
            <button (click)="play()" [disabled]="!canPlay" class="btn-game-main">
              START DRAW
            </button>
          </div>
        </div>
      </div>

      <div class="lg:col-span-4">
        <div class="h-full rounded-3xl border-b-4 border-black/40 bg-[#0f121a] p-5 shadow-2xl">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xs font-black uppercase tracking-widest text-cyan-500">Paytable</h3>
            <span class="text-[10px] text-slate-500">{{ selectedNumbers.length }} Selected</span>
          </div>
          
          <div class="space-y-2 max-h-[500px] overflow-y-auto pr-2 custom-scroll">
            <div *ngFor="let row of paytableEntries" 
                 class="pay-row-3d flex justify-between items-center py-3 px-4 rounded-xl border border-white/5 bg-black/40"
                 [ngClass]="{'pay-row-3d-active': isPaytableHit(row.matches)}">
              <div class="flex items-center gap-3">
                <div class="h-2 w-2 rounded-full" [ngClass]="isPaytableHit(row.matches) ? 'bg-emerald-400 animate-pulse' : 'bg-slate-700'"></div>
                <span class="text-xs font-bold text-slate-300">{{ row.matches }} Matches</span>
              </div>
              <span class="font-mono font-black" [class.text-cyan-400]="!isPaytableHit(row.matches)" [class.text-emerald-400]="isPaytableHit(row.matches)">
                {{ row.multiplier }}x
              </span>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</section>
